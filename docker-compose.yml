version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retreat-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: retreat_user
      POSTGRES_PASSWORD: retreat_pass
      POSTGRES_DB: retreat_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retreat_user -d retreat_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
